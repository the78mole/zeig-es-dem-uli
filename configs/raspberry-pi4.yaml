# Raspberry Pi 4 Beispielkonfiguration
# Raspberry Pi 4 example configuration

architecture: arm64

distribution:
  name: ubuntu
  release: jammy
  mirror: http://ports.ubuntu.com/ubuntu-ports

hostname: raspberry-pi4

root_password: raspberry

packages:
  # Basis-System
  - systemd
  - udev
  - kmod
  - network-manager
  - openssh-server
  - sudo
  
  # Editoren
  - vim
  - nano
  
  # Netzwerk-Tools
  - net-tools
  - iputils-ping
  - wget
  - curl
  - wireless-tools
  - wpasupplicant
  
  # Hardware-Tools
  - i2c-tools
  - spi-tools
  
  # Multimedia (optional)
  - ffmpeg
  - v4l-utils
  
  # Python
  - python3
  - python3-pip
  - python3-gpiozero
  - python3-rpi.gpio
  
  # Development
  - build-essential
  - git

kernel:
  source: package
  package: linux-image-generic

output:
  name: rpi4-ubuntu-image
  format: tar.gz
  compression: true

# WiFi-Konfiguration (optional)
# Diese Konfiguration kann nach dem Boot angepasst werden
network:
  interfaces:
    eth0:
      method: dhcp
    wlan0:
      method: dhcp
